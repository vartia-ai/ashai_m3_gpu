# m3gpu: start Ghostty through /usr/local/bin/ghostty, which runs it on the CPU
# renderer in the G15 session (it needs desktop OpenGL 3.3; the G15 Mesa has 2.1).
# Install as ~/.config/systemd/user/app-com.mitchellh.ghostty.service.d/m3gpu-g15-wrapper.conf
# then: systemctl --user daemon-reload && systemctl --user restart app-com.mitchellh.ghostty.service
[Service]
ExecStart=
ExecStart=/usr/local/bin/ghostty --gtk-single-instance=true --initial-window=false
